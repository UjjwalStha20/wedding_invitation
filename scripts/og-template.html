<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Aarav &amp; Sita — Wedding Invitation</title>
    <style>
      @font-face {
        font-family: 'Cinzel';
        src: url('/fonts/cinzel-latin.woff2') format('woff2');
        font-style: normal;
        font-weight: 400 900;
        font-display: block;
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        src: url('/fonts/cormorant-garamond-latin.woff2') format('woff2');
        font-style: normal;
        font-weight: 300 700;
        font-display: block;
      }
      @font-face {
        font-family: 'Cormorant Garamond';
        src: url('/fonts/cormorant-garamond-latin-italic.woff2') format('woff2');
        font-style: italic;
        font-weight: 300 700;
        font-display: block;
      }
      @font-face {
        font-family: 'Tiro Devanagari Hindi';
        src: url('/fonts/tiro-devanagari-hindi.woff2') format('woff2');
        font-style: normal;
        font-weight: 400;
        font-display: block;
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #35121b;
        color: #fff5e5;
        font-family: 'Cormorant Garamond', Georgia, serif;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(ellipse at 50% 43%, rgba(139, 30, 45, 0.92) 0%, rgba(114, 28, 44, 0.95) 38%, #5b1523 68%, #35121b 100%);
      }
      .pattern { position: absolute; inset: 0; width: 100%; height: 100%; color: #c6a15b; opacity: 0.18; }
      .mandala { position: absolute; left: 50%; top: 50%; width: 820px; height: 820px; transform: translate(-50%, -50%); color: #c6a15b; opacity: 0.14; }
      .frame {
        position: absolute;
        inset: 24px;
        border: 1px solid rgba(198, 161, 91, 0.72);
      }
      .frame::after {
        content: '';
        position: absolute;
        inset: 7px;
        border: 1px solid rgba(198, 161, 91, 0.28);
      }
      .corner {
        position: absolute;
        width: 96px;
        height: 96px;
        color: #c6a15b;
        opacity: 0.85;
      }
      .tl { top: 22px; left: 22px; }
      .tr { top: 22px; right: 22px; transform: rotate(90deg); }
      .br { bottom: 22px; right: 22px; transform: rotate(180deg); }
      .bl { bottom: 22px; left: 22px; transform: rotate(-90deg); }
      .diamond {
        position: absolute;
        left: 50%;
        width: 9px;
        height: 9px;
        transform: translateX(-50%) rotate(45deg);
        border: 1px solid rgba(198, 161, 91, 0.8);
        background: #5b1523;
      }
      .diamond.top { top: 19px; }
      .diamond.bottom { bottom: 19px; }

      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 48px 150px 70px;
        text-align: center;
      }
      .sanskrit {
        margin: 0;
        font-family: 'Tiro Devanagari Hindi', serif;
        font-size: 24px;
        letter-spacing: 0.06em;
        color: #e8d5a7;
      }
      .lotus { margin-top: 16px; width: 54px; height: 28px; color: #c6a15b; }
      .blessing {
        margin: 14px 0 0;
        font-size: 25px;
        font-style: italic;
        color: rgba(255, 245, 229, 0.72);
        letter-spacing: 0.015em;
      }
      .names {
        margin: 8px 0 0;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 30px;
        font-size: 76px;
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: -0.012em;
        color: #f5e7c8;
      }
      .amp {
        font-size: 62px;
        font-style: italic;
        font-weight: 400;
        color: #c6a15b;
      }
      .surnames {
        margin: 2px 0 0;
        font-family: 'Cinzel', serif;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        color: rgba(198, 161, 91, 0.8);
      }
      .divider { margin-top: 20px; width: 440px; height: 26px; color: #c6a15b; }
      .date {
        margin: 16px 0 0;
        font-family: 'Cinzel', serif;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #e8d5a7;
      }
      .venue {
        margin: 10px 0 0;
        font-size: 23px;
        letter-spacing: 0.025em;
        color: rgba(255, 245, 229, 0.64);
      }
      .shubh {
        position: absolute;
        bottom: 44px;
        left: 0;
        right: 0;
        margin: 0;
        text-align: center;
        font-family: 'Tiro Devanagari Hindi', serif;
        font-size: 27px;
        letter-spacing: 0.05em;
        color: #c6a15b;
      }
      .shubh-en {
        position: absolute;
        bottom: 78px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: 'Cinzel', serif;
        font-size: 11px;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: rgba(232, 213, 167, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg class="pattern" aria-hidden="true">
        <defs>
          <pattern id="og-pattern" width="150" height="150" patternUnits="userSpaceOnUse">
            <g fill="none" stroke="currentColor" stroke-width="0.7">
              <path d="M75 51c8 9 8 17 0 26-8-9-8-17 0-26Z" />
              <path d="M75 74c8 9 8 17 0 26-8-9-8-17 0-26Z" />
              <path d="M51 75c9-8 17-8 26 0-9 8-17 8-26 0Z" />
              <path d="M74 75c9-8 17-8 26 0-9 8-17 8-26 0Z" />
              <circle cx="75" cy="75" r="2" />
              <path d="M0 0l7 7M150 0l-7 7M0 150l7-7M150 150l-7-7" />
            </g>
          </pattern>
        </defs>
        <rect width="1200" height="630" fill="url(#og-pattern)" />
      </svg>

      <svg class="mandala" viewBox="0 0 480 480" fill="none" stroke="currentColor" aria-hidden="true">
        <circle cx="240" cy="240" r="228" stroke-width="0.7" stroke-dasharray="2 9" opacity="0.5" />
        <circle cx="240" cy="240" r="210" stroke-width="0.8" opacity="0.6" />
        <g opacity="0.65">
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(0 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(30 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(60 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(90 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(120 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(150 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(180 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(210 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(240 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(270 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(300 240 240)" />
          <path d="M240 26c10 20 10 34 0 52-10-18-10-32 0-52Z" stroke-width="0.8" transform="rotate(330 240 240)" />
        </g>
        <circle cx="240" cy="240" r="168" stroke-width="0.8" opacity="0.5" />
        <circle cx="240" cy="240" r="118" stroke-width="0.7" opacity="0.55" />
        <circle cx="240" cy="240" r="72" stroke-width="0.9" opacity="0.6" />
      </svg>

      <div class="frame"></div>
      <span class="diamond top"></span>
      <span class="diamond bottom"></span>

      <svg class="corner tl" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M2 98V32C2 15 15 2 32 2h66" stroke="currentColor" stroke-width="1.2" />
        <path d="M11 98V35C11 21 21 11 35 11h63" stroke="currentColor" stroke-width="0.6" opacity="0.5" />
        <path d="M32 2c8 10 8 20 0 30-8-10-8-20 0-30Z" stroke="currentColor" stroke-width="0.8" />
        <path d="M2 32c10 8 20 8 30 0-10-8-20-8-30 0Z" stroke="currentColor" stroke-width="0.8" />
        <circle cx="32" cy="32" r="2.2" fill="currentColor" />
      </svg>
      <svg class="corner tr" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M2 98V32C2 15 15 2 32 2h66" stroke="currentColor" stroke-width="1.2" />
        <path d="M11 98V35C11 21 21 11 35 11h63" stroke="currentColor" stroke-width="0.6" opacity="0.5" />
        <path d="M32 2c8 10 8 20 0 30-8-10-8-20 0-30Z" stroke="currentColor" stroke-width="0.8" />
        <path d="M2 32c10 8 20 8 30 0-10-8-20-8-30 0Z" stroke="currentColor" stroke-width="0.8" />
        <circle cx="32" cy="32" r="2.2" fill="currentColor" />
      </svg>
      <svg class="corner br" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M2 98V32C2 15 15 2 32 2h66" stroke="currentColor" stroke-width="1.2" />
        <path d="M11 98V35C11 21 21 11 35 11h63" stroke="currentColor" stroke-width="0.6" opacity="0.5" />
        <path d="M32 2c8 10 8 20 0 30-8-10-8-20 0-30Z" stroke="currentColor" stroke-width="0.8" />
        <path d="M2 32c10 8 20 8 30 0-10-8-20-8-30 0Z" stroke="currentColor" stroke-width="0.8" />
        <circle cx="32" cy="32" r="2.2" fill="currentColor" />
      </svg>
      <svg class="corner bl" viewBox="0 0 100 100" fill="none" aria-hidden="true">
        <path d="M2 98V32C2 15 15 2 32 2h66" stroke="currentColor" stroke-width="1.2" />
        <path d="M11 98V35C11 21 21 11 35 11h63" stroke="currentColor" stroke-width="0.6" opacity="0.5" />
        <path d="M32 2c8 10 8 20 0 30-8-10-8-20 0-30Z" stroke="currentColor" stroke-width="0.8" />
        <path d="M2 32c10 8 20 8 30 0-10-8-20-8-30 0Z" stroke="currentColor" stroke-width="0.8" />
        <circle cx="32" cy="32" r="2.2" fill="currentColor" />
      </svg>

      <div class="content">
        <p class="sanskrit">॥ श्री गणेशाय नमः ॥</p>
        <svg class="lotus" viewBox="0 0 60 30" fill="none" aria-hidden="true">
          <path d="M30 3c6 7 6 13 0 20-6-7-6-13 0-20Z" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="0.9" />
          <path d="M30 23c8-7 14-7 22 0-8 5-14 5-22 0Z" stroke="currentColor" stroke-width="0.9" />
          <path d="M30 23c-8-7-14-7-22 0 8 5 14 5 22 0Z" stroke="currentColor" stroke-width="0.9" />
          <circle cx="30" cy="25.5" r="1.2" fill="currentColor" />
        </svg>
        <p class="blessing">Together with the blessings of our families</p>
        <p class="names">Aarav Sharma <span class="amp">&amp;</span> Sita Thapa</p>
        <p class="surnames">Sharma · Thapa</p>
        <svg class="divider" viewBox="0 0 440 26" fill="none" aria-hidden="true">
          <path d="M6 13h160M274 13h160" stroke="currentColor" stroke-width="1" stroke-linecap="round" />
          <circle cx="180" cy="13" r="2" fill="currentColor" opacity="0.7" />
          <circle cx="260" cy="13" r="2" fill="currentColor" opacity="0.7" />
          <path d="M190 13c6-5 9-5 14 0-5 5-8 5-14 0Z" stroke="currentColor" stroke-width="0.8" />
          <path d="M236 13c6 5 9 5 14 0-5-5-8-5-14 0Z" stroke="currentColor" stroke-width="0.8" />
          <path d="M220 3.5 228 13l-8 9.5L212 13l8-9.5Z" stroke="currentColor" stroke-width="1" />
          <path d="M220 8 224 13l-4 5-4-5 4-5Z" fill="currentColor" opacity="0.5" />
        </svg>
        <p class="date">2083 Kartik 21 · Saturday, 7 November 2026</p>
        <p class="venue">Hyatt Regency Kathmandu · Kathmandu, Nepal</p>
      </div>

      <p class="shubh-en">Wedding Invitation</p>
      <p class="shubh">॥ शुभ विवाह ॥</p>
    </div>
  </body>
</html>
